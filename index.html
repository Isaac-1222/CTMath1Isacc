<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computational Thinking in Mathematics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#faf6f2;--alt:#f3efe8;--ink:#1d1a1a;--mute:#6b625c;--brand:#8f0a4a;--on:#fff;--card:#fffdfb;--line:#e6dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1517;--alt:#221b1e;--ink:#f3ebe6;--mute:#b3a7a0;--brand:#d4457f;--card:#261e21;--line:#3a2f33}}
:root[data-theme="dark"]{--bg:#1a1517;--alt:#221b1e;--ink:#f3ebe6;--mute:#b3a7a0;--brand:#d4457f;--card:#261e21;--line:#3a2f33}
body{--bg:#fff;--alt:#fff;--ink:#000;--mute:#333;--card:#fff;--line:#e4e4e4;--brand:#8f0a4a}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Work Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.15}
h1,h2{text-transform:uppercase;letter-spacing:.04em}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.5rem,3vw,2.2rem)}h3{font-size:1.35rem}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 24px;gap:12px}
nav .l a{margin-right:18px;text-decoration:none;color:var(--mute);font-size:.95rem}
nav .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;font-weight:600;text-align:center}
nav .r{text-align:right}
.btn{display:inline-block;background:var(--brand);color:var(--on);padding:9px 18px;border-radius:10px;text-decoration:none;font-size:.9rem;font-weight:500;border:0;cursor:pointer;font-family:inherit}
.btn.light{background:var(--alt);color:var(--ink)}
.w{max-width:1040px;margin:0 auto;padding:64px 24px}
.alt{background:var(--alt)}
.bar{width:48px;height:3px;background:var(--brand);margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:18px;padding:24px;border:1px solid var(--line)}
.card p{color:var(--mute);margin:8px 0 0;font-size:.95rem}
.cta{background:var(--brand);color:var(--on);text-align:center}
.cta .w{padding:56px 24px}.cta p{max-width:560px;margin:14px auto 24px;opacity:.92}
.cta .btn{background:var(--bg);color:var(--ink);padding:12px 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px 28px;margin-top:32px}
.tile{text-decoration:none;display:block}
.img{aspect-ratio:4/3;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));background-size:cover;background-position:center;position:relative}
.cap{font-size:.85rem;color:var(--mute);margin:10px 0 0;text-align:left;line-height:1.4}
.big{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-bottom:18px}
.opt:empty{display:none}body.edit .opt:empty{display:block;min-height:1.3em}
.sbox{position:relative;aspect-ratio:485/402;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.sbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tb{white-space:pre-wrap;word-break:break-word;margin:0}body.edit .tb:empty{min-height:8em}
.editonly{display:none}body.edit .editonly{display:block}
.img.wide{aspect-ratio:21/9}
.img.empty{display:none}body.edit .img.empty{display:block}
.tile h3{margin:14px 0 4px}.tile p{margin:0;color:var(--mute);font-size:.92rem}
.pill{display:inline-block;background:var(--alt);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.8rem;color:var(--mute);margin-bottom:10px}
.sec p{max-width:70ch;white-space:pre-line}
.crit{display:grid;grid-template-columns:1fr 1fr;gap:32px 40px;margin-top:28px}
.crit h3{margin-bottom:6px}.crit p{margin:0;color:var(--mute)}
.back{display:inline-block;margin-bottom:24px;color:var(--ink)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
#tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
body.edit [data-k]{outline:1px dashed var(--brand);outline-offset:3px;cursor:text;min-width:2ch}
body.edit .img{cursor:pointer;outline:2px dashed var(--brand);outline-offset:3px}
body.edit .img::after{content:"Click to change image";position:absolute;inset:auto 10px 10px auto;background:var(--brand);color:var(--on);font-size:.75rem;padding:3px 10px;border-radius:8px}
body.edit [data-k]:empty::before{content:"Type here…";color:var(--mute)}
.del{display:none}body.edit .del{display:inline-block;margin-top:10px}
@media(max-width:760px){.two,.cards,.grid,.crit,.hero{grid-template-columns:1fr}nav{grid-template-columns:1fr auto}nav .t{display:none}.w{padding:44px 20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>window.FINAL={"site": "Computational Thinking in Mathematics", "heroTitle": "COMPUTATIONAL THINKING THROUGH INTEGRATED MATHEMATICS LEARNING ", "intro": "Computational thinking is thinking systematically to understand, solve and evaluate problems. It is not limited to computer programming. It is usually described through six overlapping skills: decomposition, pattern recognition, abstraction, algorithm, logical thinking and evaluation.", "c1t": "Decomposition", "c1p": "Breaking a complex problem into smaller, manageable part.", "c2t": "Pattern recognition ", "c2p": "Identifying similarities, repetitions, trends or relationship in information.", "c3t": "Abstraction", "c3p": "Identifying the important information and actively ignoring unnecessary details to comtrust a simplified representation of the problem.", "c4t": "Algorithms", "c4p": "A clear, ordered sequence of steps usd to solve a problem or accomplish a task.", "c5t": "Logical reasoning", "c5p": "Using fact, relationships, rules and evidence to reach a valid, justifiable conclusion.", "c6t": "Evaluation", "c6p": "Checking, testing and judging whether a solution is correct, efficient, appropriate and reasonable.\n\n\n", "ctaT": "Read the four activity analyses", "ctaP": "Each page sets out the objective, materials, step-by-step procedure, the computational thinking skills used, and a full critical analysis.", "workT": "Four activities, one algebra strand", "workP": "Two unplugged, two plugged-in — each analysed for the computational thinking it draws on.", "heroCap": "Made By : ISAAC KHIU CHEE YEW MT1", "introHead": "WHAT IS COMPUTATIONAL THINKING?", "acts": [{"type": "Unplugged", "title": "ALGEBRA BALANCE CHALLENGE: SOLVING LINEAR EQUATIONS \n", "blurb": "Unplugged activity — linear equations\n", "c1": "#c8372d", "c2": "#e8b923", "obj": "This activity help students understand the concept of equality in algebra and solve simple linear equations using physical objects.\n", "mat": "1. A simple beam balance (a ruler resting on a pencil)\n2. Small boxes\n3. Paper and pencil\n4. A set of equation cards (e.g. 2x + 3 = 11)\n", "proc": "1. Divide students into small groups.\n2. Give each group an equation card, such as x + 2 = 6.\n3. Students represent the equation using objects:\n        Unknown x → Small boxes labelled \"x\" \n        Numbers  →  Identical boxes \n4. Students maintain the balance (equality) by removing or adding the same number of objects to both sides.\n5. Students gradually isolate x.\n6. Students record each step as an algebraic equation.\n7. Students check their answer by substituting the value of x back into the original equation.\n8. Repeat with two more equation cards of increasing difficulty.\n8. Groups explain the steps they used and compare their methods.", "skills": "Decomposition \nBreak the equation into smaller parts, such as 2x, +2, and =10.\n\nPattern Recognition \nRecognise that the same operation must be performed on both sides.\n\nAlgorithm \nFollow a sequence: simplify → isolate the variable → solve → check.\n\nLogical Reasoning\nDetermine which operation is needed to isolate x.\n\nEvaluation\nSubstitute the answer back into the original equation to verify it.\n", "s": "The physical, hands-on nature of the balance makes the abstract rule “do the same to both sides” concrete and memorable, and it needs no equipment beyond everyday classroom materials.", "e": "The activity is effective for helping students understand the steps involved in solving linear equations. Students can visually see why the same operation must be performed on both sides.", "l": "Physical materials may also be difficult to prepare or manage for a large class. Some students may focus more on manipulating the objects than understanding the underlying algebraic concept.", "i": "Provide equations with different difficulty levels according to students' abilities.The activity can also be followed by individual algebra questions to ensure students can apply the concept ", "c2": "#e8b923", "obj": "This activity allow student easily understand the concept of progression or pattern by using physical model such as staircases. ", "mat": "1. A box of ice-cream sticks\n2. Coloured pencils\n3. Paper and pencil\n", "proc": "1. In groups of three, students build Step 1 of a staircase pattern using ice-cream sticks (4 ice-cream sticks for one square step) and record the count.\n2. Students build Step 2 by adding more toothpicks to extend the staircase, then record the new total.\n3. Students continue to Step 3 and Step 4, using a different coloured pencil each time to mark only the toothpicks that were added, making the common difference visible.\n4. Groups complete the recording table for n = 1 to 5 and describe, in their own words, the fixed number of toothpicks added at every step.\n5. Groups use the first term and the common difference from their table to write a general formula for the nth step.\n6. Test it by predicting Step 6 before building it.\n6. Check the formula against several figures to test the accuracy.\n", "skills": "Decomposition\nStudent break the pattern into repeated components and examine how each figure is constructed.\n\nPattern Recognition\nStudent identify the constant constant number of toothpicks added at every step.\n\nAlgorithm\nFollow steps to construct → count → compare → predict → formulate a rule.\n\nLogical Reasoning\nExplain why the general formula works for every step of staircase.\n\nEvaluation\nTest the formula to determine whether it is correct.\n", "s": "This activity makes pattern more visual because students physically add pieces at each step, the constant difference d is something they can see and touch, not just calculate.\n", "e": "This activity make pattern learning proses become enjoyable throughout the adding and finding common increase of ice-cream stick.", "l": "Students may identify the pattern but struggle to express it using an algebraic formula.", "i": "Provide patterns with different le e relationship between changes in the y-intercept and changes in the graph.", "l": "The main activity limited only focus on the y-intercept. Therefore, students may not fully explore other aspects of linear functions, such as slope, rate of change and different forms of linear equations.", "i": "This activity can be improve by adding prediction questions.“If the y-intercept changes from 2 to 5, where do you predict the graph will move?” Students then test their prediction using GeoGebra. This strengthens logical reasoning and evaluation.\n", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAOYA6IDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwABAgQFBgcI/8QAWhAAAQQBAgMFBAQGDggEBQEJAgABAwQSBREGEyIHITEyQRRCUVIjYWJxCBUzcoGzJDZTVnR1gpGUoaKywdMYN0NUkqSx0RY0VdIXJURjc6MmNYPhRUZkhML/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/xAAlEQEBAAICAgICAwEBAQAAAAAAAQIRITEDEgRRM0ETIjIjYQX/2gAMAwEAAhEDEQA/AD/g7dk/BvHfBd3UuItH9ttxagdcT9qmj2Boon22A2Xqn+jl2X/vZL+n2f8AMXNfgkf6uNS/jib9TCvbksrdlJNPNm/Bx7L/AN7P/P2f8xL/AEcOy397Jf0+x/mL0lJL2p+sebf6OXZf+9kv6fZ/zEv9HLsv/ez/AM/Z/wAxekpI9qNR5t/o5dl/72S/p9n/ADEv9HLsv/eyX9Ps/wCYvSkke9+xqPNf9HLsv/eyX9Ps/wCYl/o5dl/72S/p9n/MXpSSPenqfTzX/Ry7L/3sl/T7P+Yn/wBHHsv/AHsl/T7P+YvSUkvejUebf6OPZf8AvYL+n2f8xCP8HPsv/eyX9Ns/5i9O3dBkU5ZX7EkeRXuwHs4iZ8eHC/ptn/MXIj2P8E/jHlFonR8Papv/AHr3HUt8SXB3BaLVRL62WftTsgNHsC7NpRYj4cL+m2f8xagfg69l/wC9kv6fZ/zF1GkGxAK34U8craq4x57/AKOHZd+9l/6fZ/zEv9HDsu/ey/8AT7P+YvShTrWZVnqPMn/By7L/AN7Jf0+z/mJf6OXZf+9kv6fZ/wAxelpk90esea/6OXZf+9kv6fZ/zEv9HLsv/eyX9Ps/5i9KSRujUea/6OXZf+9kv6fZ/wAxL/Ry7L/3sl/T7P8AmL0pJG6NR5r/AKOXZf8AvZL+n2f8xL/Ry7L/AN7P/P2f8xelJiRujUea/wCjn2X/AL2S/p9n/MS/0c+y/wDeyX9Ps/5i9KSFHtRqPNf9HLsv/eyX9Ps/5if/AEcuy/8AeyX9Ps/5i9JTqfa0ajzX/Ry7L/3sl/T7P+Yl/o5dl/72S/p9n/MXpJJI9qNR5t/o5dl/72S/p9n/ADE3+jl2X/vZL+n2f8xelJ0rlfs/WPNC/B07L/3sl/T7P+Yl/o59l/72S/p9n/MXp var D={reflH:"Reflection and conclusion",reflP:"Working through these four activities showed me that computational thinking is not limited to programming. Even with simple physical and online activities, students able to learn mathematics with fun and enjoyable. Student also get to apply all the computational thinking skill throughout these activities. Student start with breaking problems into parts, spotting patterns , following step-by-step procedures and making rational conclusion and prove at the end of the activities.\n\nThe unplugged activities made abstract ideas, all of the model and tools are handmade so student can physically touch and play it. Even the simple items such as ruler balance and ice-cream stick allow visible,  hands-on activities for student to learn efficient. On  the other hand , plugged-in activities are perform by using different online platform such as Number Pattern Game in Scratch and Linear Equation in GeoGebra. Let students test ideas quickly and see the effect of a change straight away on screen. This interactive environment make lesson become remarkable",conP:"As a conclusion, I strongly recommend these unplugged activities and plugged-in activities to be organise at every school. Student definitely will having a lovely moment with peer and teacher and learn new skills at the same time. There all form me. Bye.",
site:"Computational Thinking in Mathematics",
heroTitle:"Computational thinking in algebra",
intro:"This portfolio studies where computational thinking surfaces inside algebra, and where it does not.\n\nThe task asks for two unplugged activities — done with physical materials, no screens — and two plugged-in activities that use software, in this case Scratch and GeoGebra. Every activity page follows the same structure: Objective, Materials, Procedure, Computational Thinking Skills Used, and a Critical Analysis covering strengths, effectiveness, limitations, and possible improvements.",
c1t:"Abstraction",c1p:"Letting a symbol, a cup, or a slider stand for any value, not one fixed number.",
c2t:"Algorithm design",c2p:"Writing a general, repeatable procedure — by hand, or as a sequence of Scratch blocks.",

{type:"Unplugged",title:"The Human Balance: Solving Linear Equations with a Balance Beam",blurb:"Unplugged activity — linear equations & progressions",c1:"#c8372d",c2:"#e8b923",
obj:"Students model a linear equation on a balance beam, using cups for the unknown and counters for the constants.",
mat:"Balance beam or ruler, paper cups, counters in two colours, worksheet.",
proc:"1. Set up the equation on the two pans.\n2. Do the same to both sides to keep the beam level.\n3. Isolate one cup and read off its value.",
skills:"Abstraction — a cup stands for any unknown value. Algorithm design — the same-to-both-sides rule becomes a repeatable procedure.",
s:"The physical, hands-on nature of the balance makes the abstract rule “do the same to both sides” concrete and memorable, and it needs no equipment beyond everyday classroom materials.",
e:"Well suited to introducing linear equations to Form 1-2 students who have not yet met formal symbolic manipulation; the physical consequence of an unbalanced pan gives immediate, self-correcting feedback that a worksheet alone cannot.",
l:"The model becomes awkward once the equation involves negative numbers or coefficients that cannot be shared evenly between cups. It is also slow for a full class of equations, and the balance itself cannot represent variables on both sides of the equation without extra scaffolding from the teacher.",
i:"Introduce a second colour of counter to represent negative units before moving to equations with subtraction. Follow the session with a short reflection journal entry, and pair the activity with the GeoGebra slider activity in this portfolio so students can check their balance-beam answers against a dynamic graph."},
{type:"Unplugged",title:"Toothpick Staircases: Discovering Arithmetic Progressions",blurb:"Unplugged activity — linear equations & progressions",c1:"#1e88c8",c2:"#e8b923"},

skills:"Abstraction — a and d are treated as adjustable parameters rather than fixed numbers, separating the general rule from any one sequence. Pattern recognition — students connect a steeper or shallower line on the graph to a larger or smaller common difference. Simulation and modelling — sliders let students test “what if” changes instantly rather than recomputing by hand. Evaluation — students verify the software's output against their own hand calculation rather than trusting it blindly."}]};
